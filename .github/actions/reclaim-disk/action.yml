name: Reclaim runner disk
description: Delete the runner's unused toolchains when the build would not fit.

# The LiveKit SDK and libwebrtc build to a target/ measured in gigabytes, and
# the cargo cache restores another copy of the registry beside it. The image
# ships tens of gigabytes of toolchains this repository never asks for, so the
# space is there to be had. The deletion itself costs two minutes, and the
# current image's disk already leaves over 100 GB free, so it is paid only on
# an image that does not, which is the one that ran out. `df` both sides, so the
# next failure of this kind reports what was actually available.
runs:
  using: composite
  steps:
    - shell: sh
      run: |
        df -h /
        avail=$(df --output=avail -BG / | tail -n 1 | tr -dc 0-9)
        if [ "$avail" -lt 40 ]; then
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/local/share/powershell /usr/share/swift /usr/local/.ghcup \
            "${AGENT_TOOLSDIRECTORY:-/opt/hostedtoolcache}"
          df -h /
        fi
