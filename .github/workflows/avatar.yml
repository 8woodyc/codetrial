name: avatar

on:
  schedule:
    - cron: '17 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read

env:
  # Match the check workflow so its frequently refreshed build cache is reusable.
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
  CARGO_PROFILE_TEST_DEBUG: line-tables-only
  RUSTFLAGS: -Clink-arg=-fuse-ld=mold
  # The toolchain action otherwise disables the main checks' incremental mode.
  CARGO_INCREMENTAL: 1

jobs:
  avatar:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - run: sudo apt-get update && sudo apt-get install -y libglib2.0-dev mold
      # browser-check.sh builds the server, and webrtc-sys needs Clang 21+.
      - name: Install WebRTC C++ compiler
        uses: ./.github/actions/webrtc-clang
      - uses: dtolnay/rust-toolchain@stable
      # Consume the check workflow's caches without creating a second build tree
      # in cache storage for a job that only runs weekly.
      - name: Restore cargo cache
        uses: ./.github/actions/restore-cargo-cache
      - name: Report disk after restoring the build cache
        run: df -h /
      - name: Restore vendored bytes
        uses: actions/cache/restore@v6
        with:
          path: web/vendor
          key: vendor-${{ hashFiles('web/vendor/**') }}
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Restore Chromium
        uses: actions/cache/restore@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - run: npx playwright install --with-deps chromium
      - run: BROWSER_CHECK_FLOW=avatar BROWSER_CHECK_REQUIRE_MODEL=1 ./scripts/browser-check.sh
      - name: Report disk after the browser check
        if: always()
        run: df -h /
