# Upstream's normalized manifest; only [dependencies.zip] changed, see README.md.

[package]
edition = "2021"
name = "webrtc-sys-build"
version = "0.3.19"
build = false
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "Build utilities when working with libwebrtc"
readme = false
license = "Apache-2.0"
repository = "https://github.com/livekit/rust-sdks"

[lib]
name = "webrtc_sys_build"
path = "src/lib.rs"

[dependencies.anyhow]
version = "1.0"

[dependencies.fs2]
version = "0.4"

[dependencies.regex]
version = "1.0"

[dependencies.reqwest]
version = "0.12"
features = [
    "rustls-tls-native-roots",
    "blocking",
]
default-features = false

[dependencies.scratch]
version = "1.0"

[dependencies.semver]
version = "1.0"

[dependencies.zip]
version = "9.0"
features = ["deflate-flate2-zlib-rs"]
default-features = false
